<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Translocator</title>
  <defs>
    <!-- Two panes, each a half of the tile: the local side in indigo, the
         remote side in teal, both deepening towards the bottom. -->
    <linearGradient id="left" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9A8CFF"/>
      <stop offset="0.5" stop-color="#5B4FE8"/>
      <stop offset="1" stop-color="#241C6E"/>
    </linearGradient>
    <linearGradient id="right" x1="0.4" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6FF0DC"/>
      <stop offset="0.5" stop-color="#14A8C8"/>
      <stop offset="1" stop-color="#0B3F66"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile, inside Apple's 824 pt grid on a 1024 pt canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="#241C6E"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="412" height="824" fill="url(#left)"/>
    <rect x="512" y="100" width="412" height="824" fill="url(#right)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
    <!-- The line between the panes. -->
    <rect x="509" y="100" width="6" height="824" fill="url(#seam)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
