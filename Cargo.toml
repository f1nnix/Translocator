[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tl-core = { path = "crates/tl-core" }
tl-local = { path = "crates/tl-local" }
tl-ssh = { path = "crates/tl-ssh" }

gpui-kit = "0.7.3"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
env_logger = "0.11"
filetime = "0.2"
libc = "0.2"
log = "0.4"
notify = "8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
# Keep debug builds responsive: gpui is painfully slow fully unoptimized.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
