[package]
name = "translocator"
description = "Dual-pane file manager with an SSH command-protocol provider"
repository = "https://github.com/f1nnix/Translocator"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# The GPUI shell is no longer what Linux ships (that is translocator-gtk,
# whose binary is `translocator`), so this one has a name of its own.
[[bin]]
name = "translocator-gpui"
path = "src/main.rs"

[dependencies]
# The core (state and behaviour) and the runtime that carries out its effects.
tl-app.workspace = true
tl-runtime.workspace = true
# Only for the askpass client mode in `main`.
tl-core.workspace = true
# The colour schemes, shared with the macOS app.
tl-themes.workspace = true

chrono.workspace = true
env_logger.workspace = true
# Only to decode the embedded window icon; gpui already pulls this in.
image = { version = "0.25", default-features = false, features = ["png"] }
log.workspace = true
serde_json.workspace = true
smol.workspace = true

[dependencies.gpui-kit]
workspace = true
features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
]

[dev-dependencies]
tempfile.workspace = true
# GPUI's headless test platform (the same crates gpui-kit re-exports).
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }
