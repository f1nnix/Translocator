[package]
name = "translocator"
description = "Dual-pane file manager with an SSH command-protocol provider"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "translocator"
path = "src/main.rs"

[dependencies]
tl-core.workspace = true
tl-local.workspace = true
tl-ssh.workspace = true
tl-s3.workspace = true
tl-webdav.workspace = true

chrono.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures = "0.3"
libc.workspace = true
log.workspace = true
notify.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true

[dependencies.gpui-kit]
workspace = true
features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
]

[dev-dependencies]
tempfile.workspace = true
# GPUI's headless test platform (the same crates gpui-kit re-exports).
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }

# ---------------------------------------------------------------------------
# Linux packaging. Both tools reuse a binary built beforehand, so CI compiles
# once and packages twice:
#   cargo deb -p translocator --no-build --no-strip
#   cargo generate-rpm -p crates/translocator
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Ilya Rusanen <ilya@rusanen.co.uk>"
copyright = "2026 Ilya Rusanen"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
A classic dual-pane file manager. Remote locations are plugins; the SSH one \
drives a plain shell on the server through the system OpenSSH client, so \
copies between two folders on one server never travel through this machine."""
# $auto covers the linked libraries (fontconfig, freetype, ...). Wayland,
# xkbcommon, X11 and Vulkan are opened with dlopen at runtime, so dpkg cannot
# see them and they are named here.
depends = "$auto, libvulkan1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcb1, xdg-utils"
recommends = "openssh-client, mesa-vulkan-drivers, fonts-dejavu-core"
assets = [
    ["target/release/translocator", "usr/bin/", "755"],
    ["../../packaging/translocator.desktop", "usr/share/applications/", "644"],
    ["../../packaging/translocator.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/translocator/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Dual-pane file manager with an SSH command-protocol provider"
assets = [
    { source = "target/release/translocator", dest = "/usr/bin/translocator", mode = "755" },
    { source = "packaging/translocator.desktop", dest = "/usr/share/applications/translocator.desktop", mode = "644" },
    { source = "packaging/translocator.svg", dest = "/usr/share/icons/hicolor/scalable/apps/translocator.svg", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/translocator/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/translocator/README.md", mode = "644", doc = true },
]
# Same reasoning as the Debian depends above.
[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
libwayland-client = "*"
libwayland-cursor = "*"
libwayland-egl = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libX11 = "*"
libxcb = "*"
xdg-utils = "*"
