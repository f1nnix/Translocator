[package]
name = "translocator"
description = "Dual-pane file manager with an SSH command-protocol provider"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "translocator"
path = "src/main.rs"

[dependencies]
tl-core.workspace = true
tl-local.workspace = true
tl-ssh.workspace = true

chrono.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures = "0.3"
libc.workspace = true
log.workspace = true
notify.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true

[dependencies.gpui-kit]
workspace = true
features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
]
